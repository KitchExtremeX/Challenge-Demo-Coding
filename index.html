<!DOCTYPE html>
<html lang="en">
<head> 
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <!-- Customize my page title -->
   <title>The Challenge Is Real!</title>
   <!-- This is how I need to include the CSS file in my page -->
   <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- I need to Customize my greeting -->
  <h1>Hello This Is My First Working Website!</h1>
  <!-- Customize the text on my link -->
  <a href="./about.html">Click About Me</a>
  <script>
    // Fixed alert and added a small popup (modal) feature that appears on page load.
    document.addEventListener('DOMContentLoaded', function () {
      // Native alert (still present as requested/fallback)
      alert("You are looking at what drives me to relearn Full Stack Development in the Age of AI");

      // Create a simple modal popup element
      const modal = document.createElement('div');
      modal.id = 'intro-popup';
      Object.assign(modal.style, {
        position: 'fixed',
        top: '50%',
        left: '50%',
        transform: 'translate(-50%, -50%)',
        background: '#fff',
        padding: '1.25rem',
        boxShadow: '0 2px 12px rgba(0,0,0,0.25)',
        borderRadius: '8px',
        zIndex: 10000,
        maxWidth: '90%',
        textAlign: 'center'
      });

      modal.innerHTML = `
        <p style="margin:0 0 0.75rem;">You are looking at what drives me to relearn Full Stack Development in the Age of AI</p>
        <button id="close-popup" style="padding:0.5rem 1rem;border:none;background:#007bff;color:#fff;border-radius:4px;cursor:pointer">Close</button>
      `;

      // Append modal to the page
      document.body.appendChild(modal);

      // Close button handler
      document.getElementById('close-popup').addEventListener('click', function () {
        modal.remove();
      });

      // Close if user clicks outside the modal
      setTimeout(function () {
        // small timeout so the click that triggered the DOMContentLoaded doesn't immediately close it
        document.addEventListener('click', function (e) {
          if (!modal.contains(e.target)) modal.remove();
        });
      }, 50);
    });
  </script>
</body>
</html>
